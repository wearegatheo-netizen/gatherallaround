# 서버 함수 셀프 진단 — 각 Cloudflare 함수의 GET 진단 엔드포인트를 호출해
# 환경변수·컬럼 적용 상태를 출력한다 (키 원문·개인정보 없음, 발송 없음).
# 개발 환경에서 외부 도메인 접근이 막혀 있을 때 원격 상태 확인용. 수동 실행 전용.
name: functions-diagnostics

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET diagnostics
        run: |
          for path in send-email send-sms send-reminders; do
            echo "== /$path"
            curl -sS --max-time 60 "https://gatherallaround.com/$path" || true
            echo; echo
          done
      - name: Supabase Edge Function / RPC 존재 확인 (커뮤니티 인증·메일)
        # 더미 값으로 호출해 배포 여부만 본다 — 404/NOT_FOUND면 미배포. 키는 공개 페이지 소스에서 추출.
        run: |
          PAGE=$(curl -sS --max-time 60 https://gatherallaround.com/)
          URL=$(echo "$PAGE" | grep -o "https://[a-z]*\.supabase\.co" | head -1)
          KEY=$(echo "$PAGE" | grep -o "const SUPABASE_KEY = '[^']*'" | sed "s/.*'\(.*\)'/\1/")
          for fn in verify-community-admin verify-meeting-password; do
            code=$(curl -sS -o /tmp/out -w "%{http_code}" --max-time 30 -X POST "$URL/functions/v1/$fn" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d '{"password":"__probe__","meetingId":"00000000-0000-4000-8000-000000000000"}')
            echo "edge $fn -> HTTP $code: $(head -c 160 /tmp/out)"; echo
          done
          for rpc in community_update_meeting community_delete_meeting; do
            code=$(curl -sS -o /tmp/out -w "%{http_code}" --max-time 30 -X POST "$URL/rest/v1/rpc/$rpc" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            echo "rpc $rpc -> HTTP $code: $(head -c 160 /tmp/out)"; echo
          done
      - name: iTunes Search API 도달성·CORS 확인 (마이페이지 가수·곡 검색)
        # 브라우저 fetch와 같은 조건(Origin 헤더)으로 호출해 상태 코드·CORS 헤더·국가별 결과 수를 본다.
        run: |
          echo "== 헤더 (country=KR, term=iu)"
          curl -sS -D - -o /dev/null --max-time 30 -H "Origin: https://gatherallaround.com" \
            "https://itunes.apple.com/search?term=iu&entity=song&limit=1&country=KR" | grep -i "^HTTP\|access-control\|retry-after" || true
          echo; echo "== 국가·검색어별 결과 수 (entity=song, lang=ko_kr)"
          for c in KR US JP; do for t in "아이유" "iu" "잔나비" "bts"; do
            out=$(curl -sS -G --max-time 30 -H "Origin: https://gatherallaround.com" \
              --data-urlencode "term=$t" --data-urlencode "entity=song" --data-urlencode "limit=3" \
              --data-urlencode "country=$c" --data-urlencode "lang=ko_kr" "https://itunes.apple.com/search")
            echo "country=$c term=$t -> $(echo "$out" | jq -c '{n:.resultCount, first:(.results[0] // {} | {artistName,trackName})}' 2>/dev/null || echo "$out" | head -c 150)"
          done; done
          echo; echo "== KR 변형: media=music&entity=musicTrack / entity 없음 / lang 없음"
          for q in "media=music&entity=musicTrack" "media=music" "entity=song"; do
            out=$(curl -sS -G --max-time 30 --data-urlencode "term=아이유" --data-urlencode "country=KR" --data-urlencode "limit=3" "https://itunes.apple.com/search?$q")
            echo "$q -> $(echo "$out" | jq -c '{n:.resultCount, first:(.results[0] // {} | {artistName,trackName,kind})}' 2>/dev/null || echo "$out" | head -c 150)"
          done
